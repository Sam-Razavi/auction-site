{% extends "base.html" %}

{% block content %}
<div class="card card-pad">
  {% if auction %}
    <h2 style="margin-top: 0;">Edit auction</h2>
    <p class="muted">Update the auction information.</p>
  {% else %}
    <h2 style="margin-top: 0;">Create auction</h2>
    <p class="muted">Add a new auction to the site.</p>
  {% endif %}

  <div class="hr"></div>

  <form class="form" method="post">
    <div class="grid grid-2">
      <div>
        <label class="small">Title</label>
        <input class="input" type="text" name="title" value="{{ auction.title if auction else '' }}" required>
      </div>

      <div>
        <label class="small">Category</label>
        <input class="input" type="text" name="category" value="{{ auction.category if auction else '' }}" required>
      </div>
    </div>

    <div>
      <label class="small">Description</label>
      <textarea class="input" name="description" rows="5" required>{{ auction.description if auction else '' }}</textarea>
    </div>

    <div class="grid grid-2">
      <div>
        <label class="small">Starting bid (SEK)</label>
        <input class="input" type="number" name="starting_bid" value="{{ auction.starting_bid if auction else '' }}" required>
      </div>

      <div>
        <label class="small">End datetime (YYYY-MM-DD HH:MM)</label>
        <input class="input" type="text" name="end_datetime" value="{{ auction.end_datetime if auction else '' }}" required>
      </div>
    </div>

    <div class="actions">
      <button class="btn primary" type="submit">Save</button>
      <a class="btn" href="{{ url_for('admin.admin_auctions') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
