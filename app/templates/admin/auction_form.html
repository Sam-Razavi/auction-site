{% extends "base.html" %}

{% block content %}
{% if auction %}
    <h2>Edit auction</h2>
{% else %}
    <h2>Create auction</h2>
{% endif %}

<form method="post">
    <label>Title:</label><br>
    <input type="text" name="title" value="{{ auction.title if auction else '' }}"><br><br>

    <label>Category:</label><br>
    <input type="text" name="category" value="{{ auction.category if auction else '' }}"><br><br>

    <label>Description:</label><br>
    <textarea name="description" rows="4" cols="40">{{ auction.description if auction else '' }}</textarea><br><br>

    <label>Starting bid (SEK):</label><br>
    <input type="number" name="starting_bid" value="{{ auction.starting_bid if auction else '' }}"><br><br>

    <label>End datetime (YYYY-MM-DD HH:MM):</label><br>
    <input type="text" name="end_datetime" value="{{ auction.end_datetime if auction else '' }}"><br><br>

    <button type="submit">Save</button>
</form>

<p><a href="{{ url_for('admin.admin_auctions') }}">Back</a></p>
{% endblock %}
